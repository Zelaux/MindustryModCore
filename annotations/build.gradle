apply plugin: "java-library"

//sourceSets.main.java.srcDirs = ["src/main/java/","annotations/build/generated/sources/annotationProcessor/java/main"]
sourceSets.main.resources.srcDirs = ["src/main/resources/"]

mindustryModCore{
    setupAnnotationProject()
}

subprojects{
    tasks.withType(JavaCompile){
        targetCompatibility = 8
        sourceCompatibility = 8
        options.fork = true
    }
    apply plugin: "java-library"
    sourceSets.main.java.srcDirs = ["src/main/java"]
    sourceSets.main.resources.srcDirs = ["src/main/resources/"]
}
configure(subprojects-aproj(":annotations:localAnnotations")){
    println("it: "+project)
    mindustryModCore{
        setupAnnotationProject()
    }
}
configure(aproj(":annotations:mindustry")){
    dependencies{
        api arcModule('arc-core')
        api 'com.squareup:javapoet:1.12.1'
    }
}
configure(aproj(":annotations:common")){
    dependencies{
        api 'org.reflections:reflections:0.10.2'
        compileOnly project(":annotations:localAnnotations")
        annotationProcessor project(":annotations:localAnnotations")
    }
}
Set<Project> otherProject =
        subprojects -
                aproj(":annotations:mindustry") -
                aproj(":annotations:common") -
                aproj(":annotations:localAnnotations")
configure(subprojects - aproj(":annotations:mindustry")- aproj(":annotations:localAnnotations")){
    dependencies{
        compileOnly 'org.projectlombok:lombok:1.18.30'
        annotationProcessor 'org.projectlombok:lombok:1.18.30'
        compileOnly "org.jetbrains:annotations:24.0.1"


        implementation aproj(":annotations:mindustry")
        implementation 'commons-io:commons-io:2.5'
        implementation 'com.squareup:javapoet:1.12.1'
        implementation arcModule('arc-core')
        implementation mindustryModule("core")
        implementation "com.github.javaparser:javaparser-symbol-solver-core:$jparcerVersion"
    }
}


configure(otherProject){
    dependencies{

        implementation aproj(":annotations:common")
        implementation 'com.squareup:javapoet:1.12.1'
        implementation arcModule('arc-core')
        implementation mindustryModule("core")
        implementation "com.github.javaparser:javaparser-symbol-solver-core:$jparcerVersion"
    }
}